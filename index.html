<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Moovit</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Manifest PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2d89ef">

  <!-- Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-o9N1j7kXl3A1F4+/qk6Xw7QF5M3lSZvC5I1El2d5g5s="
    crossorigin=""
  />

</head>
<body>

  <header class="header">
    Mini Moovit
  </header>

  <main class="container">

    <!-- Gunakan Lokasi -->
    <div class="card">
      <button class="btn" onclick="detectLocation()">📍 Gunakan Lokasi Saya</button>
    </div>
    <div id="nearestInfo" class="info-text"></div>

    <!-- Dropdown Dari -->
    <div class="card">
      <label for="from">Dari</label>
      <select id="from"></select>
    </div>

    <!-- Dropdown Tujuan -->
    <div class="card">
      <label for="to">Tujuan</label>
      <select id="to"></select>
    </div>

    <!-- Tombol Cari Rute -->
    <div class="card">
      <button class="btn" onclick="searchRoute()">Cari Rute</button>
    </div>

    <!-- Map -->
    <div class="map-container">
      <div id="map" class="map"></div>
    </div>

    <!-- Hasil Rute -->
    <div class="card">
      <div id="result" style="display:none;"></div>
    </div>

  </main>

  <!-- JS Library & App -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j7kXl3A1F4+/qk6Xw7QF5M3lSZvC5I1El2d5g5s="
    crossorigin="">
  </script>

  <script src="assets/js/bfs.js"></script>
  <script src="assets/js/app.js"></script>

  <!-- Service Worker PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('Service Worker Registered'))
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>

</body>
</html>
