<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Moovit</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2d89ef">
  <!-- Leaflet CSS -->
<link 
  rel="stylesheet" 
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

</head>
<body>

  <div class="header">
    Mini Moovit
  </div>

  <div class="container">

   <div class="card">
      <button onclick="detectLocation()">📍 Gunakan Lokasi Saya</button>
   </div>
   <div id="nearestInfo" style="margin-top:10px; font-weight:bold;"></div>


    <div class="card">
      <label>Dari</label>
      <select id="from"></select>
    </div>

    <div class="card">
      <label>Tujuan</label>
      <select id="to"></select>
    </div>

    <div class="card">
      <button onclick="searchRoute()">Cari Rute</button>
    </div>

    <div class="card">
      <div id="map" style="height:300px;"></div>
    </div>


    <div class="card" id="result" style="display:none;"></div>

  </div>

  <!-- JS URUTAN WAJIB -->
  <script src="assets/js/bfs.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log("SW Error:", err));
  });
}
</script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


</body>
</html>
